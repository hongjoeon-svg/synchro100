# Render Blueprint — 대시보드에서 New + → Blueprint 로 이 저장소를 연결하면 자동 설정됩니다.
services:
  - type: web
    name: synchro100
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
